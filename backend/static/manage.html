<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Manage Indexes — Dispatch Copilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Index Management</h1>
    <nav class="header-nav">
      <a class="nav-link" href="/">Dispatch Copilot</a>
      <a class="nav-link" href="/deviations.html">Deviations</a>
    </nav>
  </header>

  <main class="manage-main">
    <section class="panel data-map-panel">
      <h2>Data Map <span class="dev-feed-hint">what the copilot retrieves from — drag to rotate</span></h2>
      <div id="dataMapStage" class="data-map-stage" aria-label="Diagram: Dispatch Copilot connected to protocol chunks, past incidents and facilities">
        <svg id="dataMapLines" class="data-map-lines" aria-hidden="true"></svg>
      </div>
    </section>

    <section class="panel index-select-bar">
      <label for="indexSelect" class="index-select-label">Index</label>
      <select id="indexSelect" class="caller-select" disabled></select>
      <span id="indexCountBadge" class="badge"></span>
      <button id="newDocumentButton" class="action-button new-document-button" type="button">+ New Document</button>
    </section>

    <div id="errorBanner" class="error-banner" hidden>
      <span id="errorBannerText"></span>
      <button id="retryButton" class="action-button none" type="button">Retry</button>
    </div>

    <div id="newDocFormSlot"></div>

    <section id="docsArea" class="docs-area"></section>
  </main>

  <div id="toastContainer" class="toast-container" aria-hidden="true"></div>
  <div id="liveRegion" aria-live="polite" class="visually-hidden"></div>

  <script src="manage.js"></script>
  <script src="data-map.js"></script>
</body>
</html>
